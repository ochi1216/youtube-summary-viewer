<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>京都市図書館 新着図書サマリ</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background-color: #f9f9f9; }
        h1 { font-size: 1.2rem; color: #333; }
        .table-container { overflow-x: auto; /* iPhone等での横スクロール対応 */ }
        table { width: 100%; border-collapse: collapse; min-width: 600px; background-color: #fff; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 0.9rem; text-align: left; }
        th { background-color: #0056b3; color: #fff; white-space: nowrap; cursor: pointer; user-select: none; }
        th:hover { background-color: #004494; }
        .col-search { width: 90%; box-sizing: border-box; padding: 2px 4px; font-size: 0.85rem; font-weight: normal; }
        .search-row th { background-color: #e9ecef; padding: 4px; cursor: default; }
        .search-row th:hover { background-color: #e9ecef; }
        #clear-filters-btn { background-color: #6c757d; color: white; border: none; border-radius: 4px; padding: 6px 12px; margin-bottom: 10px; cursor: pointer; font-size: 0.9rem; }
        #clear-filters-btn:hover { background-color: #5a6268; }
        .action-btn { background-color: #28a745; color: white; border: none; border-radius: 4px; padding: 6px 12px; margin-bottom: 10px; cursor: pointer; font-size: 0.9rem; margin-right: 5px; }
        .action-btn:hover { background-color: #218838; }
        .toggle-btn-active { background-color: #ffc107 !important; color: #333 !important; }
        .row-kept td { background-color: #fffacd !important; }
        .keep-cb { transform: scale(1.3); cursor: pointer; }
        body { --cover-w: 41px; }
        body[data-cover="M"] { --cover-w: 62.5px; }
        body[data-cover="H"] { --cover-w: 84px; }
        body[data-cover="off"] .cover { display: none; }
        .cover { float: left; width: var(--cover-w); height: auto; margin-right: 8px; border: 1px solid #ddd; }
        .cover-ctl { display: inline-block; margin-bottom: 10px; margin-left: 10px; font-size: 0.9rem; color: #333; }
        .cover-ctl button { padding: 6px 12px; border: 1px solid #adb5bd; background: #fff; color: #333; cursor: pointer; font-size: 0.9rem; margin-left: -1px; }
        .cover-ctl button:first-of-type { margin-left: 4px; border-radius: 4px 0 0 4px; }
        .cover-ctl button:last-of-type { border-radius: 0 4px 4px 0; }
        .cover-ctl button.active { background: #0056b3; color: #fff; border-color: #0056b3; }
        a { color: #0056b3; text-decoration: none; }
        a:hover { text-decoration: underline; }
        details.more { display: inline-block; vertical-align: top; text-align: left; color: #333; }
        details.more summary { cursor: pointer; list-style: none; color: #333; }
        details.more summary::-webkit-details-marker { display: none; }
        details.more summary::after { content: " ▸"; }
        details.more[open] summary::after { content: " ▾"; }
        details.more .more-body { background: #f3f4f6; border: 1px solid #ddd; border-radius: 4px; padding: 2px 6px; }
        details.more .more-body a { display: block; }
        .new-mark { font-size: 0.75rem; color: #6c757d; }
        .notice { background: #fff8e1; border-left: 4px solid #f0ad4e; color: #333; padding: 6px 10px; margin: 0 0 10px; font-size: 0.9rem; }
        .gen-at { color: #6c757d; font-size: 0.85rem; }
        .rsv { display: block; clear: both; font-size: 0.75rem; color: #6c757d; }
        .rsv::after { content: attr(data-rsv); }
        #count-bar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #ddd; padding: 6px 10px; margin: 0 -10px 10px; font-size: 0.95rem; color: #333; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
        #count-bar b { font-size: 1.05rem; }
        #count-bar .action-btn { margin: 0; }
        #bulk-bar { display: inline-flex; gap: 6px; }
        #bulk-bar .bulk-btn { padding: 4px 10px; font-size: 0.85rem; }
        #digest-view { background: #fff; color: #333; }
        .dg-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 8px; }
        .dg-head h2 { font-size: 1.1rem; margin: 0; }
        .dg-note { font-size: 0.8rem; color: #6c757d; margin: 0 0 10px; }
        .dg-card { display: flex; gap: 12px; border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #fff; }
        .dg-cover { width: 84px; height: auto; align-self: flex-start; border: 1px solid #ddd; flex: none; }
        .dg-body { min-width: 0; flex: 1; }
        .dg-title { font-size: 1.05rem; margin: 0 0 4px; }
        .dg-meta { color: #555; font-size: 0.85rem; }
        .dg-rsv { display: inline-block; margin-top: 4px; font-size: 0.85rem; color: #333; background: #f3f4f6; border: 1px solid #ddd; border-radius: 4px; padding: 0 6px; }
        .dg-desc { margin: 6px 0; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
        .dg-none { color: #888; }
        .dg-links { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
        .dg-links a, .dg-btn { font-size: 0.9rem; }
        .dg-btn { background: none; border: none; color: #0056b3; cursor: pointer; padding: 0; text-decoration: none; }
        .dg-reserve { font-weight: bold; }
        .dg-old { border-top: 1px solid #ddd; margin-top: 14px; padding-top: 8px; }
        .dg-old li { margin-bottom: 4px; }
        @media (max-width: 600px) { .dg-card { flex-direction: column; } }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const table = document.getElementById('book-table');
            const tbody = table.querySelector('tbody');
            const rows = Array.from(tbody.querySelectorAll('tr'));

            const sortHeaders = table.querySelectorAll('thead tr:first-child th');
            let currentSortCol = -1;
            let isAsc = true;

            // --- LocalStorageによるキープ状態の管理 ---
            const STORAGE_KEY = 'kyoto_lib_kept_books';
            let keptSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
            const saveKeptBooks = () => { localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(keptSet))); };

            const checkboxes = table.querySelectorAll('.keep-cb');
            checkboxes.forEach(cb => {
                const bookId = cb.dataset.bookId;
                if (keptSet.has(bookId)) {
                    cb.checked = true;
                    cb.closest('tr').classList.add('row-kept');
                }
                cb.addEventListener('change', function() {
                    const tr = this.closest('tr');
                    if (this.checked) {
                        keptSet.add(bookId);
                        tr.classList.add('row-kept');
                    } else {
                        keptSet.delete(bookId);
                        tr.classList.remove('row-kept');
                    }
                    saveKeptBooks();
                    updateCounts();
                    if (isKeptOnlyMode) filterTable();
                });
            });

            sortHeaders.forEach((header, index) => {
                header.dataset.originalText = header.textContent;
                header.addEventListener('click', () => {
                    if (currentSortCol === index) {
                        isAsc = !isAsc;
                    } else {
                        currentSortCol = index;
                        isAsc = true;
                    }
                    sortHeaders.forEach(h => h.textContent = h.dataset.originalText);
                    header.textContent = header.dataset.originalText + (isAsc ? ' ▲' : ' ▼');

                    rows.sort((a, b) => {
                        let valA = a.cells[index].textContent.trim();
                        let valB = b.cells[index].textContent.trim();
                        if (index === 5) { // 出版年月は列追加によりインデックス5に変更
                            const parseDate = (val) => {
                                if (val === '不明') return 0;
                                let parts = val.split('.');
                                return parts.length === 2 ? parseInt(parts[0]) * 100 + parseInt(parts[1]) : (parseInt(val) || 0);
                            };
                            return isAsc ? parseDate(valA) - parseDate(valB) : parseDate(valB) - parseDate(valA);
                        } else {
                            return isAsc ? valA.localeCompare(valB, 'ja') : valB.localeCompare(valA, 'ja');
                        }
                    });
                    rows.forEach(row => tbody.appendChild(row));
                });
            });

            const searchInputs = table.querySelectorAll('.col-search');
            const clearBtn = document.getElementById('clear-filters-btn');
            const normalizeText = (text) => text.normalize('NFKC').toLowerCase();
            let isKeptOnlyMode = false;
            const toggleKeptBtn = document.getElementById('toggle-kept-btn');

            // 上部バーの件数（全・表示・予約候補）。予約候補は今日のページにある本のうち✓の数
            const updateCounts = () => {
                let shown = 0, kept = 0;
                rows.forEach(r => {
                    if (r.style.display !== 'none') shown++;
                    const cb = r.querySelector('.keep-cb');
                    if (cb && cb.checked) kept++;
                });
                document.getElementById('cnt-total').textContent = rows.length;
                document.getElementById('cnt-shown').textContent = shown;
                document.getElementById('cnt-kept').textContent = kept;
            };

            const filterTable = () => {
                const queries = Array.from(searchInputs).map(input => normalizeText(input.value));
                const colMap = [0, 2, 3, 4, 5]; // 検索窓と実際の列(キープ列を除く)のマッピング
                rows.forEach(row => {
                    let isMatch = true;
                    for (let i = 0; i < queries.length; i++) {
                        if (queries[i]) {
                            const cellText = normalizeText(row.cells[colMap[i]].textContent.trim());
                            if (!cellText.includes(queries[i])) {
                                isMatch = false;
                                break;
                            }
                        }
                    }
                    if (isMatch && isKeptOnlyMode) {
                        const cb = row.querySelector('.keep-cb');
                        if (!cb || !cb.checked) isMatch = false;
                    }
                    row.style.display = isMatch ? '' : 'none';
                });
                updateCounts();
            };
            searchInputs.forEach(input => input.addEventListener('input', filterTable));

            // --- アクションボタンのイベント ---
            // 全選択／全選択解除：表示中の行だけが対象。保存と件数の更新は最後に1回だけ行う。
            // ツールバーのボタンと上部バーのボタンの、どちらも同じ処理を呼ぶ。
            const bulkSet = (on) => {
                rows.forEach(row => {
                    if (row.style.display === 'none') return;
                    const cb = row.querySelector('.keep-cb');
                    if (!cb || cb.checked === on) return;
                    cb.checked = on;
                    if (on) keptSet.add(cb.dataset.bookId); else keptSet.delete(cb.dataset.bookId);
                    row.classList.toggle('row-kept', on);
                });
                saveKeptBooks();
                updateCounts();
                if (isKeptOnlyMode) filterTable();
            };
            document.querySelectorAll('.bulk-check-all').forEach(b => b.addEventListener('click', () => bulkSet(true)));
            document.querySelectorAll('.bulk-uncheck-all').forEach(b => b.addEventListener('click', () => bulkSet(false)));

            toggleKeptBtn.addEventListener('click', () => {
                isKeptOnlyMode = !isKeptOnlyMode;
                toggleKeptBtn.textContent = isKeptOnlyMode ? '予約候補のみ表示(解除)' : '予約候補のみ表示';
                if (isKeptOnlyMode) toggleKeptBtn.classList.add('toggle-btn-active');
                else toggleKeptBtn.classList.remove('toggle-btn-active');
                filterTable();
            });

            clearBtn.addEventListener('click', () => {
                searchInputs.forEach(input => input.value = '');
                if (isKeptOnlyMode) {
                    isKeptOnlyMode = false;
                    toggleKeptBtn.textContent = '予約候補のみ表示';
                    toggleKeptBtn.classList.remove('toggle-btn-active');
                }
                filterTable();
            });

            // --- 予約候補のまとめ画面（表示だけ。書き込みは textContent と属性だけで、HTMLの文字列は組み立てない） ---
            let DATA = {};
            try { DATA = JSON.parse(document.getElementById('book-data').textContent || '{}'); } catch (e) { DATA = {}; }
            const digestView = document.getElementById('digest-view');
            const mainViews = [document.getElementById('toolbar'), document.querySelector('.table-container'), document.getElementById('bulk-bar')];
            const GB_ID = /^[A-Za-z0-9_-]{6,20}$/;
            const BIBID = /^[0-9]{6,12}$/;
            const COVER_PREFIX = 'https://books.google.com/books/content?';
            const mk = (tag, cls, text) => {
                const e = document.createElement(tag);
                if (cls) e.className = cls;
                if (text !== undefined && text !== null) e.textContent = text;
                return e;
            };
            const linkTo = (href, text, cls) => {
                const a = mk('a', cls || '', text);
                a.href = href; a.target = '_blank'; a.rel = 'noopener';
                return a;
            };
            const searchButton = (word, text) => {
                const b = mk('button', 'dg-btn', text);
                b.type = 'button';
                b.addEventListener('click', () => {
                    const f = document.createElement('form');
                    f.method = 'POST'; f.target = '_blank';
                    f.action = 'https://www.kyotocitylib.jp/winj/opac/search-standard.do?lang=ja';
                    [['txt_word', word], ['hid_word_column', 'fulltext'], ['submit_btn_searchEasy', '検索']].forEach(pair => {
                        const i = document.createElement('input');
                        i.type = 'hidden'; i.name = pair[0]; i.value = pair[1];
                        f.appendChild(i);
                    });
                    document.body.appendChild(f); f.submit(); f.remove();
                });
                return b;
            };
            const buildCard = (key, d) => {
                const card = mk('div', 'dg-card');
                if (!d) {
                    const cut = key.lastIndexOf('_');
                    d = { t: cut > 0 ? key.slice(0, cut) : key, a: '', p: '', d: '', c: '', cv: '', g: '', b: '', r: null, x: '', rv: '' };
                }
                if (typeof d.cv === 'string' && d.cv.startsWith(COVER_PREFIX)) {
                    const img = mk('img', 'dg-cover');
                    img.src = d.cv; img.alt = ''; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
                    card.appendChild(img);
                }
                const body = mk('div', 'dg-body');
                body.appendChild(mk('h3', 'dg-title', d.t));
                const meta = [d.a, d.p, d.d, d.c].filter(v => v && v !== '不明').join(' ／ ');
                if (meta) body.appendChild(mk('div', 'dg-meta', meta));
                if (typeof d.r === 'number') body.appendChild(mk('div', 'dg-rsv', '図書館の予約待ち ' + d.r + ' 件'));
                body.appendChild(d.x ? mk('p', 'dg-desc', d.x) : mk('p', 'dg-desc dg-none', '内容紹介は取得できませんでした'));
                const links = mk('div', 'dg-links');
                if (GB_ID.test(d.g || '')) links.appendChild(linkTo('https://books.google.com/books?id=' + encodeURIComponent(d.g) + '&hl=ja', '📖 Google Booksの内容紹介'));
                if ((d.rv || '').startsWith('https://www.google.com/search?')) links.appendChild(linkTo(d.rv, '🔍 書評'));
                if (BIBID.test(d.b || '')) {
                    links.appendChild(linkTo('https://www.kyotocitylib.jp/winj/opac/switch-detail.do?lang=ja&bibid=' + d.b, '📚 図書館で予約', 'dg-reserve'));
                } else {
                    links.appendChild(searchButton(d.t, '📚 図書館で書名検索'));
                }
                body.appendChild(links);
                card.appendChild(body);
                return card;
            };
            const keptKeysInPage = () => {
                const seen = new Set(), out = [];
                rows.forEach(r => {
                    const cb = r.querySelector('.keep-cb');
                    if (cb && cb.checked && !seen.has(cb.dataset.bookId)) { seen.add(cb.dataset.bookId); out.push(cb.dataset.bookId); }
                });
                return out;
            };
            let digestSortByRsv = false;
            const renderDigest = () => {
                const list = document.getElementById('digest-list');
                list.textContent = '';
                const keys = keptKeysInPage();
                if (digestSortByRsv) {
                    const rsvOf = (k) => { const d = DATA[k]; return d && typeof d.r === 'number' ? d.r : Infinity; };
                    keys.sort((a, b) => { const x = rsvOf(a), y = rsvOf(b); return x === y ? 0 : (x < y ? -1 : 1); });
                }
                if (keys.length === 0) list.appendChild(mk('p', 'dg-none', '予約候補が選ばれていません。一覧で✓を付けてください。'));
                keys.forEach(k => list.appendChild(buildCard(k, DATA[k])));
                const inPage = new Set(Array.from(checkboxes).map(cb => cb.dataset.bookId));
                const old = Array.from(keptSet).filter(k => !inPage.has(k));
                if (old.length > 0) {
                    const box = mk('div', 'dg-old');
                    box.appendChild(mk('p', 'dg-note', '前の日のページで選んだ予約候補です（このページには載っていません）。'));
                    const ul = mk('ul');
                    old.forEach(k => {
                        const cut = k.lastIndexOf('_');
                        const title = cut > 0 ? k.slice(0, cut) : k;
                        const li = mk('li');
                        li.appendChild(mk('span', '', title + ' '));
                        li.appendChild(searchButton(title, '📚 図書館で書名検索'));
                        ul.appendChild(li);
                    });
                    box.appendChild(ul);
                    list.appendChild(box);
                }
            };
            const showDigest = (on) => {
                if (on) renderDigest();
                digestView.style.display = on ? '' : 'none';
                mainViews.forEach(el => { if (el) el.style.display = on ? 'none' : ''; });
                window.scrollTo(0, 0);
            };
            document.getElementById('digest-btn').addEventListener('click', () => showDigest(true));
            document.getElementById('digest-back-btn').addEventListener('click', () => showDigest(false));
            const sortBtn = document.getElementById('digest-sort-btn');
            sortBtn.addEventListener('click', () => {
                digestSortByRsv = !digestSortByRsv;
                sortBtn.textContent = digestSortByRsv ? '元の順に戻す' : '予約待ちが少ない順';
                renderDigest();
            });
            updateCounts();
        });
    </script>
</head>
<body>
    <h1>京都市図書館 新着図書サマリ</h1>
    <div id="count-bar">
        <span>全 <b id="cnt-total">0</b> 件</span>
        <span>表示 <b id="cnt-shown">0</b> 件</span>
        <span>予約候補 <b id="cnt-kept">0</b> 件</span>
        <span class="gen-at">2026/10/28 06:15 更新</span>
        <button id="digest-btn" class="action-btn" type="button" style="background-color: #0056b3;">予約候補をまとめて見る</button>
        <span id="bulk-bar"><button id="bar-check-all-btn" class="action-btn bulk-btn bulk-check-all" type="button" title="表示中の本をすべて予約候補にする">全選択</button><button id="bar-uncheck-all-btn" class="action-btn bulk-btn bulk-uncheck-all" type="button" style="background-color: #6c757d;" title="表示中の本の予約候補をすべて外す">全選択解除</button></span>
    </div>
    <div id="toolbar" style="margin-bottom: 10px;">
        <button id="clear-filters-btn">全フィルタ解除</button>
        <button id="check-all-btn" class="action-btn bulk-check-all" type="button">全選択</button>
        <button id="uncheck-all-btn" class="action-btn bulk-uncheck-all" type="button">全選択解除</button>
        <button id="toggle-kept-btn" class="action-btn" style="background-color: #17a2b8;">予約候補のみ表示</button>
        <span class="cover-ctl">サムネイル:<button type="button" data-cover="off" title="サムネイルを表示しない">ー</button><button type="button" data-cover="L" title="標準（100%）">L</button><button type="button" data-cover="M" title="標準の150%">M</button><button type="button" data-cover="H" title="標準の200%">H</button></span>
    </div>
    <div class="table-container">
        <table id="book-table">
            <thead>
                <tr>
                    <th>分類</th>
                    <th>予約候補</th>
                    <th>書籍名</th>
                    <th>作者</th>
                    <th>出版社</th>
                    <th>出版年月</th>
                    <th>検索</th>
                </tr>
                <tr class="search-row">
                    <th><input type="text" class="col-search" placeholder="分類を検索..."></th>
                    <th></th>
                    <th><input type="text" class="col-search" placeholder="書籍名を検索..."></th>
                    <th><input type="text" class="col-search" placeholder="作者を検索..."></th>
                    <th><input type="text" class="col-search" placeholder="出版社を検索..."></th>
                    <th><input type="text" class="col-search" placeholder="年月を検索..."></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
    <div id="digest-view" style="display: none;">
        <div class="dg-head">
            <button id="digest-back-btn" class="action-btn" type="button" style="background-color: #6c757d; margin: 0;">一覧へ戻る</button>
            <h2>予約候補のまとめ</h2>
            <button id="digest-sort-btn" class="action-btn" type="button" style="background-color: #17a2b8; margin: 0;">予約待ちが少ない順</button>
        </div>
        <p class="dg-note">予約待ちの件数は、このページを作った時点のものです。予約は、各本の「図書館で予約」から図書館の詳細ページを開いて、「予約かごへ」を押してください。</p>
        <div id="digest-list"></div>
    </div>
    <script type="application/json" id="book-data">{}</script>
    <script>
        // サムネイルの大きさ切り替え（ー=非表示 / L=標準100% / M=150% / H=200%）。選択はこのブラウザに保存する。
        (function () {
            const KEY = 'kyoto_lib_cover_size';
            const VALID = ['off', 'L', 'M', 'H'];
            const buttons = document.querySelectorAll('.cover-ctl button');
            const apply = (size) => {
                document.body.dataset.cover = size;
                buttons.forEach(b => b.classList.toggle('active', b.dataset.cover === size));
            };
            let saved = 'L';
            try { const v = localStorage.getItem(KEY); if (VALID.includes(v)) saved = v; } catch (e) {}
            apply(saved);
            buttons.forEach(b => b.addEventListener('click', () => {
                apply(b.dataset.cover);
                try { localStorage.setItem(KEY, b.dataset.cover); } catch (e) {}
            }));
        })();
    </script>
</body>
</html>
