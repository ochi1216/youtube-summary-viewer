<script>/*

 *   1 = ▶    主なポイントこみ

<script>/*

    { key: "summary", name: "要旨", depth: 3 },

    if (s && !lsGet(READ_V2_KEY + "Broken")) lsSet(READ_V2_KEY + "Broken", s);

          if (!isRead(m.read, items[j], f.filename, j)) unread++;

      for (k in m.read) if (Object.prototype.hasOwnProperty.call(m.read, k)) nRead++;

        lines.push("深さ: " + parts.join(" / ") + "　残り " + pl.rest + "件");
      }
      if (!saved) lines.push("※既読を保存できませんでした(ブラウザの保存制限)");
      say(lines.join("\n"));
    }).catch(function (e) {
      say("読み込みに失敗しました: " + e);
    });
  }

  var api = {
    READ_V2_KEY: READ_V2_KEY,
    videoIdOf: videoIdOf,
    cardKey: cardKey,
    migrateOld: migrateOld,

    buildExport: buildExport,

  return api;
});

  // ---- 聴く画面 ----
  function ttsPrep(ctx, text) {
    if (!text) return text;
    ctx.lastSource = text;
    if (ctx.hist[0] !== text) { ctx.hist.unshift(text); if (ctx.hist.length > 3) ctx.hist.length = 3; }
    var out = text;
    if (W.TTSClean) {
      try {
        var extra = (ctx.dictStore && ctx.dictStore.count() > 0) ? ctx.dictStore.dict() : null;
        var c = W.TTSClean.clean(text, extra ? { extraDict: extra } : undefined);
        if (c && c.replace(/\s/g, "")) out = c;
      } catch (e) { out = text; }
    }
    return out.replace(/[：:×・]/g, "、").replace(/#+/g, "");
  }

  function thumbPress(ctx, dir) {
    var st = ctx.player && ctx.player.state();
    var e = st && st.entry;
    if (!e) { toast(ctx, "再生中のカードがありません", true); return; }
    if (!ctx.thumbClient) { toast(ctx, "保存先が設定されていないため、記録できません", true); return; }
    var row = W.YtLabels.buildFeedbackRow(e.card.item, dir, { device: IS_IOS ? "iPhone" : "PC", category: e.card.category });
    if (!row) { toast(ctx, "このカードにはAIの点が無いため、記録できません", true); return; }
    var word = dir === "up" ? "いいね" : "よくないね";
    if (ctx.thumbLast[row.card_key] === dir) { toast(ctx, "すでに" + word + "を記録済みです", false); return; }
    ctx.thumbClient.submit(row).then(function (r) {
      if (r === "denied") {
        var v = W.prompt("ラベル用の合言葉を入力してください(初回だけ)", "");
        var t = String(v || "").trim();
        if (t) { lsSet("ytLabelKey", t); toast(ctx, "合言葉を保存しました。もう一度押してください", false); }
        else toast(ctx, "合言葉が合わないため、保存できません", true);
        return;
      }
      if (r === "rejected") { toast(ctx, "保存できませんでした(形式エラー)", true); return; }
      if (ctx.thumbLast[row.card_key] === undefined) { if (dir === "up") ctx.sessionUp++; else ctx.sessionDown++; }
      ctx.thumbLast[row.card_key] = dir;
      if (ctx.player) updateListen(ctx, ctx.player.state());
      toast(ctx, word + "を記録: " + row.shown_score + " → " + row.rating + " として扱います" + (r === "queued" ? "(未送信。電波が戻ったら再送します)" : ""), false);
    });
  }

  // 全文シート: いま読んでいる部分を黄色で示す。開いている間も読み上げは続き、カードが進めば中身も替わる。

  function renderListen(ctx) {
    var doc = ctx.doc, root = ctx.root, ui = {}, i;

  // 画像が無いカードは、カード全体の高さを変えずに、画像の高さぶんを文の欄にまわす。行の途中で切れないよう、欄の高さは行の整数倍にそろえる。
  function fitText(ui) {
    var t = ui.ptext, hasThumb = ui.thumb.style.display !== "none";
    if (hasThumb) { t.style.flex = ""; t.style.height = ""; return; }
    t.style.flex = "1 1 auto"; t.style.height = "";
    var h = t.clientHeight, lh = parseFloat(W.getComputedStyle(t).lineHeight) || 25.6, n = Math.floor((h - 8) / lh);
    if (n >= 3) { t.style.flex = "none"; t.style.height = (n * lh + 8) + "px"; }
  }

  function updateListen(ctx, st) {
    var ui = ctx.ui, e = st.entry, it, key, per, i;
    if (!ui || !e) return;
    it = e.card.item;
    ui.pos.textContent = (st.i + 1) + " / " + st.total + "件・残り" + W.YMListen.minutesLabel(st.remainingSec);
    ui.fill.style.width = Math.round(100 * st.i / Math.max(1, st.total)) + "%";
    ui.card.className = "card" + (isStarred(it) ? " star" : "");
    if (it.thumbnail) { if (ui.thumb.getAttribute("src") !== it.thumbnail) ui.thumb.src = it.thumbnail; ui.thumb.style.display = ""; }
    else ui.thumb.style.display = "none";
    var sc = it.ai && typeof it.ai.s === "number" ? it.ai.s : null;
    ui.score.textContent = sc === null ? "" : String(sc);
    ui.score.className = "score" + (sc === null ? "" : " s" + sc);
    ui.score.style.display = sc === null ? "none" : "";
    ui.chan.textContent = channelName(it) + (it.duration ? (channelName(it) ? "・" : "") + it.duration : "");
    ui.title.textContent = W.YMListen.stripHtml(it.title);
    var pn = { title: "題名", summary: "要旨", conclusion: "結論", points: "主なポイント" };
    var fh = fileHeadingOf(ctx, e.card.filename);
    ui.plab.textContent = (fh ? fh + "・" : "") + (st.part ? ("いま読んでいる部分: " + pn[st.part.part]) : "");
    var shown = st.part ? st.part.text.replace(/^\d+番。\s*/, "") : "";
    if (ui.ptext.textContent !== shown) { ui.ptext.textContent = shown; ui.ptext.scrollTop = 0; }
    fitText(ui);
    ui.play.textContent = st.playing ? "⏸ 停止" : "▶ 再生";

    // 深さの列: 各深さの約N分(このカード)、いま効いている深さを青く。
    per = W.YMListen.perDepth(it, st.rate);
    var eff = st.depthKey || st.pinKey || e.key;
    for (key in ui.chips) if (Object.prototype.hasOwnProperty.call(ui.chips, key)) {
      var b = ui.chips[key], small = b.lastChild, on;
      if (key === "") { on = !st.depthKey && !st.pinKey; small.textContent = e.name; }
      else {
        on = (key === eff) && (key === st.depthKey || (!st.depthKey && !!st.pinKey && key === st.pinKey) || false);
        for (i = 0; i < per.length; i++) if (per[i].key === key) small.textContent = per[i].label;
      }
      b.className = on ? "on" : "";
    }
    ui.pin.className = "pin" + (st.pinKey ? " on" : "");
    ui.why.textContent = st.depthKey ? ("このカードだけ「" + st.depthName + "」") :
      (st.pinKey ? ("📌 ずっと「" + st.depthName + "」") : ("🎧自動: " + e.why + " → " + e.name));

    if (safeUrl(it.url)) { ui.src.href = safeUrl(it.url); ui.src.style.display = ""; } else ui.src.style.display = "none";
    var k = W.YtLabels ? W.YtLabels.cardKey(it) : "";
    ui.up.className = (k && ctx.thumbLast[k] === "up") ? "sel" : "";
    ui.down.className = (k && ctx.thumbLast[k] === "down") ? "sel" : "";

      ctx.metaKey = mk;
      setMediaMeta(W.YMListen.stripHtml(it.title), channelName(it) || "YouTubeサマリー", (st.i + 1) + "/" + st.total + "件・" + st.depthName);
    }
    updateFullHighlight(ctx, st);

  // ---- 学習(盲検で1〜5を付ける。答えは Supabase の yt_labels へ。旧UIと同じ表・同じ上限) ----
  function labelClient(ctx) {
    if (ctx.lblClient === undefined) {
      ctx.lblClient = null;
      try {
        if (W.YtLabels && W.YM_LABELS_CONFIG && W.YtLabels.createClient) {
          ctx.lblClient = W.YtLabels.createClient({
            url: W.YM_LABELS_CONFIG.url, anonKey: W.YM_LABELS_CONFIG.anonKey, storage: W.localStorage,
            getKey: function () { return lsGet("ytLabelKey") || ""; }
          });
        }
      } catch (e) { ctx.lblClient = null; }
    }
    return ctx.lblClient;
  }

  function labelButtonText(ctx) {
    var c = labelClient(ctx);
    if (!c || ctx.lblToday === undefined) return "🏷 学習";
    return "🏷 学習(今日あと" + W.YtLabels.dailyState(ctx.lblToday + c.pending()).remaining + "件)";
  }

  function labelPool(ctx, L) {
    var since = Date.now() / 1000 - 28 * 86400, pool = [], repeatPool = [], old = Date.now() - W.YtLabels.REPEAT_MIN_DAYS * 86400 * 1000;
    var queued = ctx.lblClient.pendingKeys(), i, j;
    for (i = 0; i < ctx.data.ALL_DATA.length; i++) {
      var fd = ctx.data.ALL_DATA[i];
      if ((fd.mtime || 0) < since) continue;
      var items = fd.items || [];
      for (j = 0; j < items.length; j++) {
        var it = items[j];
        if (!it || it.is_error || it.type !== "youtube" || !it.ai || typeof it.ai.s !== "number") continue;
        var key = W.YtLabels.cardKey(it);
        if (!key || L.answered[key] || queued[key]) continue;
        var c = { key: key, category: fd.category || "", s: it.ai.s, ref: it };
        if (!L.labeled[key]) pool.push(c); else if (L.labeled[key] < old) repeatPool.push(c);
      }
    }
    return { pool: pool, repeatPool: repeatPool };
  }

  function openLabeling(ctx) {
    var doc = ctx.doc, client = labelClient(ctx), L = { batch: [], idx: 0, today: 0, labeled: {}, answered: {}, busy: false };
    if (!client) return;
    if (ctx.player) ctx.player.pause();
    var sh = openSheet(ctx, "label", "学習");
    var msg = el(doc, "div", "dmsg", "読み込み中…"), box = el(doc, "div", "lblbox");
    sh.appendChild(msg); sh.appendChild(box);
    function say(t, warn) { msg.textContent = t || ""; msg.className = "dmsg" + (warn ? " warn" : ""); }
    function done(text, retry) {
      box.innerHTML = "";
      box.appendChild(el(doc, "div", "dtext", text));
      var b = el(doc, "button", "opt", retry ? "もう一度" : "閉じる");
      b.addEventListener("click", function () { if (retry) openLabeling(ctx); else closeSheet(ctx); });
      box.appendChild(b);
    }
    function refreshBtn() { ctx.lblToday = L.today; var b = doc.getElementById("ymLabelBtn"); if (b) b.textContent = labelButtonText(ctx); }
    function show() {
      var st;
      if (L.idx >= L.batch.length) {
        st = W.YtLabels.dailyState(L.today + client.pending());
        say("");
        done("おつかれさまでした。" + (st.remaining > 0 ? "今日はあと" + st.remaining + "件(" + st.roundsLeft + "回分)できます。" : "今日の分(60件)はおわりです。また明日。"), false);
        refreshBtn();
        return;
      }
      var card = L.batch[L.idx], it = card.ref;
      box.innerHTML = "";
      box.appendChild(el(doc, "div", "dnote", (L.idx + 1) + " / " + L.batch.length));
      box.appendChild(el(doc, "div", "lbl-t", W.YMListen.stripHtml(it.title || "(題名なし)")));
      box.appendChild(el(doc, "div", "lbl-m", channelName(it) + (it.duration ? "・" + it.duration : "") + (card.category ? "・" + card.category : "")));
      if (it.summary) { box.appendChild(el(doc, "h3", "", "要旨")); box.appendChild(el(doc, "div", "sec", plainBlocks(it.summary))); }
      if (it.conclusion) { box.appendChild(el(doc, "h3", "", "結論")); box.appendChild(el(doc, "div", "sec", plainBlocks(it.conclusion))); }
      var sc = el(doc, "div", "lbl-sc"), labs = ["読まない", "あまり", "ふつう", "読みたい", "必ず読む"], n;
      function mk(v) {
        var b = el(doc, "button", "", ""); b.appendChild(el(doc, "b", "", String(v))); b.appendChild(el(doc, "span", "", labs[v - 1]));
        b.addEventListener("click", function () { answer(card, v); });
        return b;
      }
      for (n = 1; n <= 5; n++) sc.appendChild(mk(n));
      box.appendChild(sc);
      var skip = el(doc, "button", "opt", "スキップ(判断できない)");
      skip.addEventListener("click", function () { if (L.busy) return; L.idx++; show(); sh.scrollTop = 0; });
      box.appendChild(skip);
      box.appendChild(el(doc, "div", "dnote", "AIの点は表示していません。「このカードを開いて読む価値があるか」を、いつもの感覚で付けてください。"));
      sh.scrollTop = 0;
    }
    function answer(card, score) {
      if (L.busy) return;
      L.busy = true;
      var row = W.YtLabels.buildRow(card, score, { device: IS_IOS ? "iPhone" : "PC" });
      client.submit(row).then(function (r) {
        L.busy = false;
        if (r === "denied") {
          var v = W.prompt("ラベル用の合言葉を入力してください(初回だけ)", ""), t = String(v || "").trim();
          if (t) lsSet("ytLabelKey", t);
          say(t ? "合言葉を保存しました。もう一度、答えてください。" : "合言葉が合わないため、保存できません。", true);
          return;
        }
        if (r === "sent") L.today += 1;
        L.answered[card.key] = 1; L.idx++;
        var pend = client.pending();
        say(r === "rejected" ? "保存できなかった回答がありました(形式エラー)。" : (pend > 0 ? "未送信 " + pend + "件(電波が戻ったら自動で再送します)" : ""), r === "rejected" || pend > 0);
        refreshBtn();
        show();
      });
    }
    if (!lsGet("ytLabelKey")) {
      var v0 = W.prompt("ラベル用の合言葉を入力してください(初回だけ)", ""), t0 = String(v0 || "").trim();
      if (!t0) { say(""); done("合言葉が必要です。", true); return; }
      lsSet("ytLabelKey", t0);
    }
    client.flush().then(function () {
      return Promise.all([client.countToday(W.YtLabels.jstDay()), client.listLabeled()]);
    }).then(function (res) {
      L.today = res[0];
      res[1].forEach(function (r) {
        var t = Date.parse(r.labeled_at) || 1;
        if (!L.labeled[r.card_key] || t > L.labeled[r.card_key]) L.labeled[r.card_key] = t;
      });
      refreshBtn();
      var st = W.YtLabels.dailyState(L.today + client.pending());
      if (st.size === 0) { say(""); done("今日の分(60件)はおわりです。また明日。", false); return; }
      var p = labelPool(ctx, L);
      L.batch = W.YtLabels.pickBatch(p.pool, { n: st.size, repeatPool: p.repeatPool });
      if (!L.batch.length) { say(""); done("いま答えられるカードがありません。新しいサマリーが増えたら、また。", false); return; }
      say("今日あと" + st.remaining + "件。この回は" + L.batch.length + "件です。");
      show();
    }, function () { say(""); done("つながりませんでした。電波のよい所で、もう一度。", true); });
  }

  // ---- 読み方の登録(旧UIと同じ辞書: 端末に保存し、共有の辞書にも送る) ----
  function openDict(ctx) {
    var store = ctx.dictStore, doc = ctx.doc, i;
    if (!store || !W.TtsUserDict) { toast(ctx, "読み方の部品を読み込めませんでした", true); return; }
    if (ctx.player) ctx.player.pause();      // 登録中は読み上げを止める(続きは再生ボタンで)
    var sh = openSheet(ctx, "dict", "読み方を登録");

    sh.appendChild(el(doc, "h3", "", "直前に読み上げた文"));
    var histBox = el(doc, "div", "dhist");
    var names = ["いま", "1つ前", "2つ前"];
    if (!ctx.hist.length) histBox.appendChild(el(doc, "div", "dnote", "まだ読み上げていません。言葉は手で入力できます。"));
    for (i = 0; i < ctx.hist.length; i++) {
      histBox.appendChild(el(doc, "div", "dlab", names[i]));
      histBox.appendChild(el(doc, "div", "dtext", ctx.hist[i]));
    }
    sh.appendChild(histBox);
    sh.appendChild(el(doc, "div", "dnote", "上の文の中の言葉を長押しで選ぶと、「言葉」の欄に入ります。"));

    var word = el(doc, "input", "dinp"); word.type = "text"; word.placeholder = "言葉(例: Claude)"; word.setAttribute("autocomplete", "off");
    var reading = el(doc, "input", "dinp"); reading.type = "text"; reading.placeholder = "正しい読み(例: クロード)"; reading.setAttribute("autocomplete", "off");
    sh.appendChild(word); sh.appendChild(reading);
    var msg = el(doc, "div", "dmsg");
    function say(t, warn) { msg.textContent = t || ""; msg.className = "dmsg" + (warn ? " warn" : ""); }

    var row = el(doc, "div", "links");
    var test = el(doc, "button", "", "▶ 試し読み"), add = el(doc, "button", "", "＋ 登録");
    row.appendChild(test); row.appendChild(add);
    sh.appendChild(row); sh.appendChild(msg);

    var listHead = el(doc, "h3", ""), list = el(doc, "div", "dlist");
    sh.appendChild(listHead); sh.appendChild(list);

    function renderList() {
      var items = store.entries(), k;
      list.innerHTML = "";
      listHead.textContent = "登録した言葉(" + items.length + ")";
      if (!items.length) list.appendChild(el(doc, "div", "dnote", "まだ登録がありません。"));
      function mkRow(e) {
        var r = el(doc, "div", "ditem");
        r.appendChild(el(doc, "span", "dw", e.w)); r.appendChild(el(doc, "span", "dr", e.r));
        r.appendChild(el(doc, "span", "dtag", e.status === "local" ? "端末のみ" : "共有"));
        var x = el(doc, "button", "dx", "×"); x.setAttribute("aria-label", e.w + "を削除");
        x.addEventListener("click", function () {
          if (!W.confirm("「" + e.w + "」の登録を削除しますか")) return;
          store.remove(e.w); say("削除しました。"); renderList(); sync();
        });
        r.appendChild(x);
        return r;
      }
      for (k = 0; k < items.length; k++) list.appendChild(mkRow(items[k]));
    }

    function sync() {
      return store.sync(ctx.dictClient).then(function (r) {
        renderList();
        if (r && ctx.dictClient) {
          if (r.denied) say("合言葉が合わないか、1日の上限に達したため、共有に送れませんでした(端末には保存されています)", true);
          else if (r.rejected > 0) say(r.rejected + "件は共有に受け付けられませんでした(端末には保存されています)", true);
          else if (r.failed > 0) say("通信できないため、共有には送れていません。次に開いたときに再送します(端末には保存されています)", true);
          else if (r.sent > 0) say("共有の辞書にも送信しました(他の端末にも反映されます)");
        }
      }, function () { });
    }

    add.addEventListener("click", function () {
      var res = store.add(word.value, reading.value);
      if (!res.ok) { say(res.error, true); return; }
      word.value = ""; reading.value = "";
      say("登録しました。次の読み上げから効きます。");
      renderList();
      if (ctx.dictClient && !lsGet("ytLabelKey") && !ctx.dictAsked) {      // 共有に送るための合言葉(👎👍と同じもの)
        ctx.dictAsked = true;
        var v = String(W.prompt("共有の辞書に送るための合言葉を入力してください(初回だけ)", "") || "").trim();
        if (v) lsSet("ytLabelKey", v);
      }
      sync();
    });

    // 試し読み: 直前に読んだ文のうち、その言葉を含む1文を、その読みで聞く(無ければ言葉そのもの)
    test.addEventListener("click", function () {
      var w = word.value.replace(/^\s+|\s+$/g, ""), r = reading.value.replace(/^\s+|\s+$/g, "");
      var err = W.TtsUserDict.validate(w, r);
      if (err) { say(err, true); return; }
      var base = ctx.hist.length ? ctx.hist[0] : w, h, seg, ps, p;
      for (h = 0; h < ctx.hist.length; h++) if (ctx.hist[h].indexOf(w) >= 0) { base = ctx.hist[h]; break; }
      seg = base; ps = base.split("。");
      for (p = 0; p < ps.length; p++) if (ps[p].indexOf(w) >= 0) { seg = ps[p]; break; }
      if (seg.length > 120) { var at = Math.max(0, seg.indexOf(w) - 40); seg = seg.slice(at, at + 120); }
      var extra = {}, cur = store.dict(), k;
      for (k in cur) if (Object.prototype.hasOwnProperty.call(cur, k)) extra[k] = cur[k];
      extra[w] = r;
      var txt = seg;
      if (W.TTSClean) { try { txt = W.TTSClean.clean(seg, { extraDict: extra }) || seg; } catch (e) { txt = seg; } }
      try {
        W.speechSynthesis.cancel();
        var ut = new W.SpeechSynthesisUtterance(txt);
        ut.rate = ctx.rate; pickVoice(ut);
        W.speechSynthesis.speak(ut);
        say("試し読み: " + (txt.length > 40 ? txt.slice(0, 40) + "…" : txt));
      } catch (e) { say("試し読みできませんでした。", true); }
    });

    if (!ctx.dictSelBound) {
      ctx.dictSelBound = true;
      doc.addEventListener("selectionchange", function () {
        var s2 = ctx.sheet;
        if (!s2 || s2.getAttribute("data-mode") !== "dict" || s2.className.indexOf("show") < 0) return;
        var sel = W.getSelection ? W.getSelection() : null;
        if (!sel || sel.isCollapsed || !sel.anchorNode) return;
        var wi = s2.querySelector("input.dinp"), hb = s2.querySelector(".dhist");
        if (!wi || !hb || !hb.contains(sel.anchorNode)) return;
        var t = sel.toString().replace(/^\s+|\s+$/g, "");
        if (t && t.length <= 40) wi.value = t;
      });
    }

    renderList();
    sync();
  }

  // ---- 終わり・離れる・始める ----
  function renderEnd(ctx) {
    var doc = ctx.doc, root = ctx.root;
    root.innerHTML = "";
    root.className = "ym";
    root.appendChild(el(doc, "h1", "", "ここまで聴きました"));
    var plan = makePlan(ctx);
    root.appendChild(el(doc, "pre", "", "この回で既読にしたカード: " + ctx.sessionRead + "件\n👍 " + ctx.sessionUp + "件 / 👎 " + ctx.sessionDown + "件\n残りの未読: " + plan.total + "件"));
    if (plan.session.length) {
      var more = el(doc, "button", "big", "▶ 続けて聴く(次の" + plan.session.length + "件・" + W.YMListen.minutesLabel(plan.sec) + ")");
      more.addEventListener("click", function () { startListening(ctx, plan); });
      root.appendChild(more);
    }
    var hb = el(doc, "button", "chip", "ホームへ戻る");
    hb.addEventListener("click", function () { renderHome(ctx); });
    root.appendChild(hb);
    ensureOverlays(ctx);
  }

  // 聴き終わりを声でも知らせる(画面を見ていなくても分かるように)。
  function announceEnd(ctx) {
    setTimeout(function () {      // 「次」で終わったときは、直前に cancel しているので、少し間を空ける(iOSは直後の speak が落ちる)
      try {
        var ut = new W.SpeechSynthesisUtterance("聴き終わりました。");
        ut.rate = ctx.rate; pickVoice(ut);
        W.speechSynthesis.speak(ut);
      } catch (e) { }
    }, 80);
  }

  function leaveListen(ctx) {
    if (ctx.player) { ctx.player.destroy(); ctx.player = null; }
    clearMediaSession();
    bgStopSoon(function () { return false; });
    renderHome(ctx);
  }

  // 本日の方角の読み上げ文: 針の1行 + 「今日読むもの」のうち「仕事に効く」「プライベート」の中身(見出し・要旨・事実・理由・行動)。
  function compassText(ctx) {
    var d = ctx.data.DASHBOARD_DATA, comp = d && d.compass, out = [];
    function plain(t) { return W.YMListen.stripHtml(String(t || "")).replace(/^\s+|\s+$/g, ""); }
    function end(t) { t = plain(t); return t && !/[。!?！？]$/.test(t) ? t + "。" : t; }
    if (comp && comp.needle_text) out.push(end(comp.needle_text));
    try {
      if (d && d.es_html && W.DOMParser) {
        var dom = new W.DOMParser().parseFromString(d.es_html, "text/html"), box = dom.querySelector(".es"), kids = box ? box.children : [], i, on = false;
        for (i = 0; i < kids.length; i++) {
          var k = kids[i], cls = " " + k.className + " ";
          if (cls.indexOf(" es-group ") >= 0) {
            var g = plain(k.textContent);
            on = (g === "仕事に効く" || g === "プライベート");
            if (on) out.push(end(g));
          } else if (cls.indexOf(" es-item ") >= 0 && on) {
            var h = k.querySelector(".es-head b"), sm = k.querySelector(".es-sum"), fs = k.querySelectorAll(".es-facts li"), why = k.querySelector(".es-why"), act = k.querySelector(".es-act"), j;
            if (h) out.push(end(h.textContent));
            if (sm) out.push(end(sm.textContent));
            for (j = 0; j < fs.length; j++) out.push(end(fs[j].textContent));
            if (why) out.push(end(why.textContent));
            if (act) out.push(end(act.textContent));
          } else on = false;
        }
      }
    } catch (e) { }
    return out.join("\n");
  }

  // 本日の方角を読み上げる(ボタンで始め・止め)。聴く画面に入る前に必ず止める。
  function stopCompass(ctx) {
    ctx.cgen = (ctx.cgen || 0) + 1;
    if (ctx.compassOn) { ctx.compassOn = false; try { W.speechSynthesis.cancel(); } catch (e) { } }
  }
  function toggleCompass(ctx, text, btn) {
    if (ctx.compassOn) { stopCompass(ctx); btn.textContent = "🔊 聴く"; return; }
    var parts = (String(text).match(/[^。]*。|[^。]+$/g) || []).filter(function (x) { return x.replace(/\s/g, ""); }), gen = (ctx.cgen = (ctx.cgen || 0) + 1), i = 0;
    if (!parts.length || !W.speechSynthesis) return;
    ctx.compassOn = true; btn.textContent = "⏹ 止める";
    try { W.speechSynthesis.cancel(); } catch (e) { }
    function fin() { if (ctx.cgen !== gen) return; ctx.compassOn = false; var b = ctx.doc.getElementById("ymCompassBtn"); if (b) b.textContent = "🔊 聴く"; bgStopSoon(function () { return false; }); }
    function next() {
      if (ctx.cgen !== gen) return;
      if (i >= parts.length) { fin(); return; }
      var ut = new W.SpeechSynthesisUtterance(ttsPrep(ctx, parts[i++]));
      pickVoice(ut); ut.rate = ctx.rate;
      var called = false;
      function go() { if (called) return; called = true; setTimeout(next, 10); }
      ut.onend = go; ut.onerror = function (ev) { if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return; ctx.compassOn = false; fin(); };
      try { W.speechSynthesis.speak(ut); } catch (e) { fin(); }
    }
    bgStart();
    setTimeout(next, 80);
  }

  function startListening(ctx, plan) {
    stopCompass(ctx);
    if (ctx.player) ctx.player.destroy();
    ctx.sessionRead = 0; ctx.sessionUp = 0; ctx.sessionDown = 0; ctx.sessionPlan = plan; ctx.metaKey = ""; ctx.fullKey = "";
    renderListen(ctx);
    var p = W.YMPlayer.create({
      items: plan.session, listen: W.YMListen, synth: W.speechSynthesis,
      newUtterance: function (t) { return new W.SpeechSynthesisUtterance(t); },
      voice: pickVoice, prep: function (t) { return ttsPrep(ctx, t); }, rate: ctx.rate,
      bg: { start: bgStart, stopSoon: function () { bgStopSoon(function () { return ctx.player && ctx.player.state().playing; }); } },
      onChange: function (st) { updateListen(ctx, st); },
      onCardEnd: function (e) { markRead(ctx, e.card); },
      onFinish: function () { announceEnd(ctx); renderEnd(ctx); },
      onError: function (why) { toast(ctx, "読み上げできませんでした(" + why + ")。▶ で再開できます", true); }
    });
    ctx.player = p;
    if (ctx.pinKey) p.setPin(ctx.pinKey);
    setMediaSession(ctx);
    updateListen(ctx, p.state());
    p.play();      // 「▶ 聴く」を押した操作の中で始める(iOSは、押した操作の中でないと音を出せない)
  }

  function boot(doc) {
    var root = doc.getElementById("ym-root");
    var style = doc.createElement("style"); style.textContent = CSS; doc.head.appendChild(style);
    root.className = "ym";
    function say(t) { root.innerHTML = ""; root.appendChild(el(doc, "pre", "", t)); }
    say("index.html を読み込み中…");
    // 画面に戻ってきたとき、読み上げ中なら画面スリープ抑止を取り直す(タブが隠れると自動で解放されるため)。
    doc.addEventListener("visibilitychange", function () {
      if (doc.visibilityState === "visible" && W.ymCtx && W.ymCtx.player && W.ymCtx.player.state().playing) bgStart();
    });
    W.fetch("index.html", { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (html) {
      var d = W.YMBeta.extractData(html);
      if (!d) { say("index.html にデータの目印がありません。公開バッチを一度実行してください。"); return; }
      var ctx = buildCtx(doc, d, html);
      ctx.root = root;
      W.ymCtx = ctx;
      renderHome(ctx);
    }).catch(function (e) { say("読み込みに失敗しました: " + e); });
  }

  return { boot: boot, _plainBlocks: plainBlocks };
});
</script>
<script>YMApp.boot(document);</script>
